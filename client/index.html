    <!-- GA4: ορίστε VITE_GA_MEASUREMENT_ID=G-xxxxxxxx στο Railway/Vite (όχι εδώ — χρειάζεται build-time). Βλ. client/src/components/google-analytics.tsx -->
    <script>
      (function(){
        if(window.matchMedia('(prefers-color-scheme: dark)').matches){
          document.documentElement.classList.add('dark');
        }
        var RELOAD_KEY = 'hitech_chunk_reload_pending';
        function isStaleChunk(msg){
          msg = String(msg || '');
          return msg.indexOf('Failed to fetch dynamically imported module') !== -1
            || msg.indexOf('Importing a module script failed') !== -1
            || msg.indexOf('error loading dynamically imported module') !== -1
            || msg.indexOf('ChunkLoadError') !== -1
            || msg.indexOf('Loading chunk') !== -1
            || msg.indexOf('Loading CSS chunk') !== -1;
        }
        function reloadOnce(){
          if(sessionStorage.getItem(RELOAD_KEY)) return;
          sessionStorage.setItem(RELOAD_KEY, '1');
          window.location.reload();
        }
        window.addEventListener('error', function(e){
          if(isStaleChunk(e.message || (e.error && e.error.message))){
            e.preventDefault();
            reloadOnce();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e){
          if(isStaleChunk(e.reason)){
            e.preventDefault();
            reloadOnce();
          }
        });
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- BoxNow: preconnect μόνο στη σελίδα αποστολής (Helmet) — αποφεύγει unused preconnect στην αρχική -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
